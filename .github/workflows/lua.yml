name: Shadow core validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
      - name: Check Lua syntax
        run: |
          find . -name '*.lua' -type f -print0 | xargs -0 -n1 luac5.4 -p
